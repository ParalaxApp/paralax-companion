# Builds the Windows installer on GitHub's own Windows computers, so nobody needs to build it by hand.
# - Every push: builds it and keeps the installer for 14 days under the run's "Artifacts".
# - Pushing a version tag (e.g. v0.1.0): also makes a Release with the installer attached, ready to share.
name: Build Windows installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build installer
        run: npx electron-builder --win nsis --publish never
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Paralax-Verse-Companion-installer
          path: dist/*.exe
          retention-days: 14
      - name: Make a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
