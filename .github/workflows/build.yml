# Builds the Windows installer (and an experimental Linux AppImage) on GitHub's own computers, so nobody needs to build it by hand.
# - Every push: builds it and keeps the installer for 14 days under the run's "Artifacts".
# - Pushing a version tag (e.g. v0.1.0): also makes a Release with the installer attached, ready to share.
name: Build Windows installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build installer
        run: npx electron-builder --win nsis --publish never
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Paralax-Verse-Companion-installer
          path: dist/*.exe
          retention-days: 14
      # Publish each NEW version (when package.json's version changes) to the public download repository,
      # where paralaxverse.com/companion/download points. The code itself stays private.
      - name: Publish new version for download
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No RELEASE_TOKEN secret yet, skipping"; exit 0; fi
          REPO=ParalaxApp/paralax-companion-download
          VER=$(node -p "require('./package.json').version")
          # the download repository needs a first file before it can hold releases
          if ! gh api repos/$REPO/contents/README.md >/dev/null 2>&1; then
            printf '# Paralax Verse Companion\n\nDownloads for the Paralax Verse Companion, a free, unofficial Star Citizen fan app.\nGet it at https://paralaxverse.com/companion\n' > /tmp/readme.md
            gh api -X PUT repos/$REPO/contents/README.md -f message="Downloads" -f content="$(base64 -w0 /tmp/readme.md)"
          fi
          if gh release view "v$VER" --repo $REPO >/dev/null 2>&1; then echo "v$VER is already published"; exit 0; fi
          cp dist/*.exe "dist/Paralax-Verse-Companion-Setup.exe"
          # a fingerprint (SHA-256) of the download, so anyone can check their copy is the genuine one
          (cd dist && sha256sum Paralax-Verse-Companion-Setup.exe > SHA256SUMS.txt)
          SUM=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          printf 'Free, unofficial Star Citizen companion from paralaxverse.com. Windows 10 and 11. Not affiliated with Cloud Imperium Games.\n\nCheck your download is genuine (SHA-256):\n\n`%s`  Paralax-Verse-Companion-Setup.exe\n\nOn Windows: open PowerShell in your Downloads folder and run `Get-FileHash Paralax-Verse-Companion-Setup.exe`. The Hash shown should match the one above.\n' "$SUM" > dist/notes.md
          gh release create "v$VER" "dist/Paralax-Verse-Companion-Setup.exe" "dist/SHA256SUMS.txt" --repo $REPO --title "Paralax Verse Companion $VER" \
            --notes-file dist/notes.md --latest
      - name: Make a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  # Linux (experimental): an AppImage, for pilots playing Star Citizen through Wine / Proton.
  # Runs after the Windows build, and adds the AppImage to the same download release.
  linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never
      - name: Keep the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Paralax-Verse-Companion-linux
          path: dist/*.AppImage
          retention-days: 14
      - name: Add it to the download release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No RELEASE_TOKEN secret yet, skipping"; exit 0; fi
          REPO=ParalaxApp/paralax-companion-download
          VER=$(node -p "require('./package.json').version")
          if ! gh release view "v$VER" --repo $REPO >/dev/null 2>&1; then echo "No v$VER release yet"; exit 0; fi
          cp dist/*.AppImage "dist/Paralax-Verse-Companion.AppImage"
          # add the AppImage's fingerprint to the release's SHA256SUMS.txt and notes
          gh release download "v$VER" --repo $REPO --pattern SHA256SUMS.txt --dir /tmp/sums --clobber || true
          (cd dist && sha256sum Paralax-Verse-Companion.AppImage) >> /tmp/sums/SHA256SUMS.txt
          gh release upload "v$VER" "dist/Paralax-Verse-Companion.AppImage" /tmp/sums/SHA256SUMS.txt --repo $REPO --clobber
          gh release view "v$VER" --repo $REPO --json body -q .body > /tmp/notes.md
          printf '\n`%s`  Paralax-Verse-Companion.AppImage (Linux: `sha256sum Paralax-Verse-Companion.AppImage`)\n' "$(sha256sum dist/Paralax-Verse-Companion.AppImage | cut -d' ' -f1)" >> /tmp/notes.md
          gh release edit "v$VER" --repo $REPO --notes-file /tmp/notes.md
