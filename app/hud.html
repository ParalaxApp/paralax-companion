<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Light strip</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    /* The small strip in the corner of the screen. Clicks pass through it to the game. */
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;color:#ECEEF1;-webkit-font-smoothing:antialiased}
    /* Cinematic: no box. Text floats over a soft dark haze, with a thin yellow line that fades out. */
    .hud{position:absolute;inset:6px;display:flex;flex-direction:column;justify-content:center;padding:6px 16px;
      background:radial-gradient(ellipse 85% 100% at 0% 50%,rgba(4,8,13,.62),rgba(4,8,13,0) 75%);transition:background .6s}
    .hud::before{content:"";position:absolute;left:4px;top:14%;bottom:14%;width:1px;background:linear-gradient(180deg,transparent,#5fc8ea,transparent);transition:background .6s}
    .k{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(159,216,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000}
    .v{text-shadow:0 1px 3px #000,0 0 14px rgba(0,0,0,.8);font:700 21px 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.12em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .v em{font-style:normal;color:#FFC21A;text-shadow:0 1px 3px #000,0 0 12px rgba(255,194,26,.55)}
    .hud.soon::before,.hud.gold::before{background:linear-gradient(180deg,transparent,#FFC21A,transparent)}
    .hud.soon{animation:pulse 1.6s ease-in-out infinite}
    .hud.gold{background:radial-gradient(ellipse 85% 100% at 0% 50%,rgba(90,62,4,.7),rgba(4,8,13,0) 75%)}
    @keyframes pulse{50%{background:radial-gradient(ellipse 85% 100% at 0% 50%,rgba(90,62,4,.6),rgba(4,8,13,0) 75%)}}
    @media (prefers-reduced-motion:reduce){.hud.soon{animation:none}}
  </style>
</head>
<body>
  <div class="hud" id="hud"><div class="k" id="k">Paralax Verse</div><div class="v" id="v">Companion ready</div></div>
  <script src="dn.js"></script>
  <script src="hud.js"></script>
</body>
</html>
