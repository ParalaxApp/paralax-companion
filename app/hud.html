<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Light strip</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    /* The small strip in the corner of the screen. Clicks pass through it to the game. */
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;color:#ECEEF1;-webkit-font-smoothing:antialiased}
    /* mobiGlas look, toned down: smoky glass with a faint cool tint, attached to the screen edge.
       Rounded corners only on the side facing the game. Gold only on the text when golden hour is near. */
    .hud{position:absolute;top:8px;bottom:8px;left:8px;right:0;display:flex;flex-direction:column;justify-content:center;padding:6px 18px;border-radius:10px 0 0 10px;
      background:linear-gradient(160deg,rgba(205,228,240,.10),rgba(140,170,190,.05) 60%,rgba(205,228,240,.04)),repeating-linear-gradient(0deg,rgba(205,228,240,.025) 0 1px,transparent 1px 4px),rgba(8,13,18,.42);
      box-shadow:inset 1px 0 0 rgba(205,228,240,.32),inset 0 1px 0 rgba(205,228,240,.22),inset 0 -1px 0 rgba(205,228,240,.22);backdrop-filter:blur(8px);
      transition:box-shadow .6s;color:#eef4f7;text-shadow:0 1px 2px rgba(0,0,0,.7)}
    .hud[data-side=left]{left:0;right:8px;border-radius:0 10px 10px 0;box-shadow:inset -1px 0 0 rgba(205,228,240,.32),inset 0 1px 0 rgba(205,228,240,.22),inset 0 -1px 0 rgba(205,228,240,.22)}
    .k{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(205,228,240,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .v{font:700 21px 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.08em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
    .v em{font-style:normal;color:#FFC21A}
    /* golden hour close or now: a thin gold line on the glass, the glass itself stays the same */
    .hud.soon,.hud.gold{box-shadow:inset 2px 0 0 #FFC21A,inset 0 1px 0 rgba(205,228,240,.22),inset 0 -1px 0 rgba(205,228,240,.22)}
    .hud[data-side=left].soon,.hud[data-side=left].gold{box-shadow:inset -2px 0 0 #FFC21A,inset 0 1px 0 rgba(205,228,240,.22),inset 0 -1px 0 rgba(205,228,240,.22)}
    .hud.soon .v em{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.45}}
    @media (prefers-reduced-motion:reduce){.hud.soon .v em{animation:none}}
  </style>
</head>
<body>
  <div class="hud" id="hud"><div class="k" id="k">Paralax Verse</div><div class="v" id="v">Companion ready</div></div>
  <script src="dn.js"></script>
  <script src="hud.js"></script>
</body>
</html>
